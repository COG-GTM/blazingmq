# Define the tools required to build this project.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Describe the development, code-generation, and integration-test tooling.
[project]
name = "blazingmq-dev"
version = "0.1.0"
description = "BlazingMQ development, code-generation and integration-test tooling"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = [
    "psutil",
    "termcolor",
    "xsdata",
]

# Keep test and development dependencies as opt-in extras.
[project.optional-dependencies]
test = [
    "boofuzz",
    "crc32c",
    "pytest",
    "pytest-cmake",
    "pytest-cov",
    "pytest-order",
    "pytest-repeat",
    "pytest-timeout",
    "pytest-rerunfailures==14.0",
    "pytest-xdist",
]
dev = [
    "pylint",
    "ruff",
]

# Publish links for package consumers and contributors.
[project.urls]
Homepage = "https://bloomberg.github.io/blazingmq"
Source = "https://github.com/bloomberg/blazingmq"

# Discover the Python packages rooted at this project directory.
[tool.setuptools.packages.find]
where = ["."]
include = ["blazingmq*"]
